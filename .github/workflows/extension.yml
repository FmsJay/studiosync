# The menu extension (extension/reaper_menu.cpp, and for StudioSync the direct link, extension/direct.cpp, the web UI server, extension/webui.cpp, its docked window, extension/webui_dock*, the Hop plug-in's end, extension/hop.cpp and its network leg, extension/hopnet.cpp, and live audio, extension/rtaudio.cpp with AOO and Opus from extension/third_party, built in statically, and the connection without Tailscale, extension/nat.cpp with libjuice and Monocypher) for macOS and Linux: Windows builds on JAMES-MAIN (extension/build_windows.cmd). Each job
# leaves its files as an artifact; they go into extension/ here and in the ReaPersona repo, and the extension package's version goes up
# (EXT_VERSION in tools/make_index.py).
name: extension
on:
  workflow_dispatch:
  push:
    paths: ["extension/reaper_menu.cpp", "extension/direct.cpp", "extension/direct_audio.cpp", "extension/direct.h", "extension/sign.cpp", "extension/sign.h", "extension/webui.cpp", "extension/webui.h", "extension/webui_dock.cpp", "extension/webui_dock.h", "extension/webui_dock_mac.mm", "tests/direct_test.cpp", "tests/webui_test.cpp", "tests/webui_dock_test.cpp", "tests/sign_test.cpp", "tools/ninjam-relay/njrelay.c", ".github/workflows/extension.yml", "extension/hop.cpp", "plugin/hop_shm.h", "extension/rtaudio.cpp", "extension/rtaudio.h", "tests/rtaudio_test.cpp", "extension/hopnet.cpp", "extension/hopnet.h", "tests/hopnet_test.cpp", "plugin/hop_core.h", "extension/third_party/**", "extension/nat.cpp", "extension/nat.h", "tests/nat_test.cpp", "tests/nat_audio_test.cpp"]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDK and WDL (reaper_plugin.h includes ../WDL/swell/swell.h beside the sdk folder)
        run: |
          git clone --depth 1 https://github.com/justinfrankel/reaper-sdk
          git clone --depth 1 https://github.com/justinfrankel/WDL wdl
          ln -s "$PWD/wdl/WDL" reaper-sdk/WDL
      - name: Live audio's libraries (AOO + Opus, universal, static; timed)
        run: time sh extension/third_party/build_unix.sh libssdeps.a -arch arm64 -arch x86_64 -mmacosx-version-min=10.13
      - name: Build universal dylibs
        run: |
          rti="-I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include"
          for p in studiosync reapersona; do
            # (StudioSync's has the docked web UI: webui_dock.cpp, and its WKWebView in webui_dock_mac.mm with WebKit. James, rt)
            def=""; src="extension/reaper_menu.cpp extension/direct.cpp extension/direct_audio.cpp extension/sign.cpp extension/webui.cpp extension/webui_dock.cpp extension/hop.cpp extension/hopnet.cpp extension/webui_dock_mac.mm extension/rtaudio.cpp extension/nat.cpp libssdeps.a"; inc="$rti"; fw="-framework WebKit"
            [ "$p" = reapersona ] && def="-DREAPERSONA" && src="extension/reaper_menu.cpp" && inc="" && fw=""
            clang++ -std=c++17 -O2 -dynamiclib -arch arm64 -arch x86_64 -mmacosx-version-min=10.13 -DSWELL_PROVIDED_BY_APP $def \
              -I reaper-sdk/sdk $inc $src reaper-sdk/WDL/swell/swell-modstub.mm -framework Cocoa $fw -o "reaper_$p.dylib"
            codesign -s - "reaper_$p.dylib"
            lipo -info "reaper_$p.dylib"
          done
      # (kept before the tests: the hosted Mac runner's timing tests fail now and then (stalls of 100 ms+), and the build of a run whose code
      # passed on a real Mac was lost with them. A failing test still fails the run. rt)
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "*.dylib" }
      # Every test runs even when one before it failed (if: !cancelled()), so each reports; the job still fails if any did. CI is set here,
      # so the timing checks hold to what a loaded hosted runner meets; SS_TIMING_STRICT=1 holds them to a desktop's, as they are locally.
      - name: The direct link's own test (tests/direct_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DDIRECT_STANDALONE tests/direct_test.cpp extension/direct.cpp extension/direct_audio.cpp -o direct_test
          ./direct_test
      - name: The web UI server's own test (tests/webui_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DDIRECT_STANDALONE -DWEBUI_STANDALONE tests/webui_test.cpp extension/webui.cpp extension/direct.cpp extension/direct_audio.cpp -o webui_test
          ./webui_test
      - name: The docked web UI's own test (tests/webui_dock_test.cpp, its pure parts)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -pthread -DWEBUI_DOCK_STANDALONE tests/webui_dock_test.cpp extension/webui_dock.cpp -o webui_dock_test
          ./webui_dock_test
      - name: Signed updates' own test (tests/sign_test.cpp)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DSIGN_STANDALONE -DDIRECT_STANDALONE tests/sign_test.cpp extension/sign.cpp extension/direct.cpp extension/direct_audio.cpp -o sign_test
          ./sign_test
      - name: The Hop's network leg's own test (tests/hopnet_test.cpp, a sender and a fake remote on localhost)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DHOPNET_STANDALONE -DDIRECT_STANDALONE tests/hopnet_test.cpp extension/hopnet.cpp extension/direct.cpp extension/direct_audio.cpp -o hopnet_test
          ./hopnet_test
      - name: Live audio's own test (tests/rtaudio_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DRTAUDIO_STANDALONE -DDIRECT_STANDALONE -I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include \
            tests/rtaudio_test.cpp extension/rtaudio.cpp extension/direct.cpp extension/direct_audio.cpp libssdeps.a -o rtaudio_test
          ./rtaudio_test
      # (the connection without Tailscale, docs/realtime-roadmap.md "Without Tailscale: design": nat.cpp is in the build above too)
      - name: The connection without Tailscale's own test (tests/nat_test.cpp, ICE and sealed datagrams on localhost)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p natobj && (cd natobj && cc -O2 -c -DJUICE_STATIC -I ../extension/third_party/libjuice/include/juice ../extension/third_party/libjuice/src/*.c ../extension/third_party/monocypher/monocypher.c && cc -O2 -c -DJUICE_STATIC -Dudp_sendto=nat_relay_sendto -I ../extension/third_party/libjuice/include/juice ../extension/third_party/libjuice/src/server.c)
          clang++ -std=c++17 -O2 -DNAT_STANDALONE -DDIRECT_STANDALONE -DJUICE_STATIC tests/nat_test.cpp extension/nat.cpp extension/direct.cpp extension/direct_audio.cpp natobj/*.o -o nat_test
          sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up || true # (stage 3's two simulated symmetric NATs, each on its own address)
          ./nat_test
      - name: Live audio over the connection without Tailscale (tests/nat_audio_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          clang++ -std=c++17 -O2 -DRTAUDIO_STANDALONE -DNAT_STANDALONE -DDIRECT_STANDALONE -DJUICE_STATIC -I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include \
            tests/nat_audio_test.cpp extension/rtaudio.cpp extension/nat.cpp extension/direct.cpp extension/direct_audio.cpp libssdeps.a -o nat_audio_test
          ./nat_audio_test
      - name: njrelay for Macs (universal), as the NINJAM README's line
        run: |
          cc -O2 -Wall -arch arm64 -arch x86_64 -mmacosx-version-min=10.13 -o njrelay tools/ninjam-relay/njrelay.c
          codesign -s - njrelay
          lipo -info njrelay
      - uses: actions/upload-artifact@v4
        with: { name: mac-njrelay, path: "njrelay" }

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: SDK and WDL
        run: |
          git clone --depth 1 https://github.com/justinfrankel/reaper-sdk
          git clone --depth 1 https://github.com/justinfrankel/WDL wdl
          ln -s "$PWD/wdl/WDL" reaper-sdk/WDL
      - name: Live audio's libraries (AOO + Opus, static; timed)
        run: time sh extension/third_party/build_unix.sh libssdeps.a
      - name: Build
        run: |
          rti="-I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include"
          for p in studiosync reapersona; do
            def=""; src="extension/reaper_menu.cpp extension/direct.cpp extension/direct_audio.cpp extension/sign.cpp extension/webui.cpp extension/webui_dock.cpp extension/hop.cpp extension/hopnet.cpp extension/rtaudio.cpp extension/nat.cpp"; inc="$rti"; lib="libssdeps.a"
            [ "$p" = reapersona ] && def="-DREAPERSONA" && src="extension/reaper_menu.cpp" && inc="" && lib=""
            g++ -std=c++17 -O2 -shared -fPIC -pthread -DSWELL_PROVIDED_BY_APP $def -I reaper-sdk/sdk $inc \
              $src reaper-sdk/WDL/swell/swell-modstub-generic.cpp $lib -o "reaper_$p-${{ matrix.arch }}.so"
            nm -D --defined-only "reaper_$p-${{ matrix.arch }}.so" | grep -E "ReaperPluginEntry|SWELL"
          done
      - name: The direct link's own test (tests/direct_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DDIRECT_STANDALONE tests/direct_test.cpp extension/direct.cpp extension/direct_audio.cpp -o direct_test
          ./direct_test
      - name: The web UI server's own test (tests/webui_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DDIRECT_STANDALONE -DWEBUI_STANDALONE tests/webui_test.cpp extension/webui.cpp extension/direct.cpp extension/direct_audio.cpp -o webui_test
          ./webui_test
      - name: The docked web UI's own test (tests/webui_dock_test.cpp, its pure parts)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DWEBUI_DOCK_STANDALONE tests/webui_dock_test.cpp extension/webui_dock.cpp -o webui_dock_test
          ./webui_dock_test
      - name: Signed updates' own test (tests/sign_test.cpp)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DSIGN_STANDALONE -DDIRECT_STANDALONE tests/sign_test.cpp extension/sign.cpp extension/direct.cpp extension/direct_audio.cpp -o sign_test
          ./sign_test
      - name: The Hop's network leg's own test (tests/hopnet_test.cpp, a sender and a fake remote on localhost)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DHOPNET_STANDALONE -DDIRECT_STANDALONE tests/hopnet_test.cpp extension/hopnet.cpp extension/direct.cpp extension/direct_audio.cpp -o hopnet_test
          ./hopnet_test
      - name: Live audio's own test (tests/rtaudio_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DRTAUDIO_STANDALONE -DDIRECT_STANDALONE -I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include \
            tests/rtaudio_test.cpp extension/rtaudio.cpp extension/direct.cpp extension/direct_audio.cpp libssdeps.a -o rtaudio_test
          ./rtaudio_test
      # (the connection without Tailscale, docs/realtime-roadmap.md "Without Tailscale: design": nat.cpp is in the build above too)
      - name: The connection without Tailscale's own test (tests/nat_test.cpp, ICE and sealed datagrams on localhost)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p natobj && (cd natobj && cc -O2 -c -DJUICE_STATIC -I ../extension/third_party/libjuice/include/juice ../extension/third_party/libjuice/src/*.c ../extension/third_party/monocypher/monocypher.c && cc -O2 -c -DJUICE_STATIC -Dudp_sendto=nat_relay_sendto -I ../extension/third_party/libjuice/include/juice ../extension/third_party/libjuice/src/server.c)
          g++ -std=c++17 -O2 -pthread -DNAT_STANDALONE -DDIRECT_STANDALONE -DJUICE_STATIC tests/nat_test.cpp extension/nat.cpp extension/direct.cpp extension/direct_audio.cpp natobj/*.o -o nat_test
          ./nat_test
      - name: Live audio over the connection without Tailscale (tests/nat_audio_test.cpp, on localhost)
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -O2 -pthread -DRTAUDIO_STANDALONE -DNAT_STANDALONE -DDIRECT_STANDALONE -DJUICE_STATIC -I extension/third_party/aoo -I extension/third_party/aoo/include -I extension/third_party/opus/include \
            tests/nat_audio_test.cpp extension/rtaudio.cpp extension/nat.cpp extension/direct.cpp extension/direct_audio.cpp libssdeps.a -o nat_audio_test
          ./nat_audio_test
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: "*.so" }

  # The NINJAM server and the relay for Linux (lib/ninjam), as tools/ninjam-server/build_mac.sh and the README's njrelay line do for Macs.
  linux-ninjam:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ninjamsrv (the commit build_mac.sh pins)
        run: |
          git clone -q https://github.com/justinfrankel/ninjam.git ninjam-src
          git -C ninjam-src checkout -q f4c0eff3a1d8d5f3ead470d0c7405c3ee37da24e
          make -C ninjam-src/ninjam/server CXXFLAGS="-O2 -Wno-reorder -fsigned-char"  # (WDL wants a signed char: unsigned by default on ARM Linux)
          cp ninjam-src/ninjam/server/ninjamsrv "ninjamsrv-linux-${{ matrix.arch }}"
          file "ninjamsrv-linux-${{ matrix.arch }}"
      - name: njrelay
        run: |
          cc -O2 -Wall -o "njrelay-linux-${{ matrix.arch }}" tools/ninjam-relay/njrelay.c
          file "njrelay-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with: { name: "ninjam-linux-${{ matrix.arch }}", path: "*-linux-*" }
